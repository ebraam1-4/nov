<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى رفيقة الروح | 11/11</title>
    <!-- استيراد خطوط عربية فخمة مثل Amiri و Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050814;
            color: #f3f4f6;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* خلفية النجوم المتحركة */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* حاوية المحتوى الأساسية */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
            text-align: center;
            margin: 20px 0;
        }

        /* أيقونة القلب النجمي فوق */
        .heart-icon {
            font-size: 40px;
            color: #f43f5e;
            animation: pulse 2s infinite;
            margin-bottom: 15px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        h1 {
            font-family: 'Amiri', serif;
            font-size: 28px;
            color: #fbbf24;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* صندوق الرسالة الفصحى */
        .message-box {
            font-family: 'Amiri', serif;
            font-size: 20px;
            line-height: 2.2;
            color: #e2e8f0;
            text-align: justify;
            white-space: pre-line;
            min-height: 220px;
            border-right: 2px solid #fbbf24;
            padding-right: 15px;
            margin-bottom: 30px;
        }

        /* توقيع أو جملة الختام */
        .signature {
            font-family: 'Amiri', serif;
            font-size: 22px;
            color: #f43f5e;
            margin-top: 20px;
            font-weight: bold;
        }

        /* زر التفاعل */
        .love-btn {
            background: linear-gradient(135deg, #f43f5e, #be123c);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .love-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.6);
        }

        /* قلوب متطايرة عند الضغط */
        .floating-heart {
            position: absolute;
            color: #f43f5e;
            font-size: 20px;
            animation: floatUp 3s linear forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- خلفية النجوم -->
    <div class="stars" id="starsContainer"></div>

    <div class="container">
        <div class="heart-icon">🌌</div>
        <h1>إلى رفيقَةَ الروحِ ونبضَ القلبِ</h1>
        
        <div class="message-box" id="typingText"></div>

        <div class="signature">أحبُّكِ بكلِّ ما تعنيه هذه الكلمة من نبضٍ ومعنى. ❤️</div>

        <button class="love-btn" onclick="createHearts()">أرسلي نبضة قلب ✨</button>
    </div>

    <script>
        // توليد النجوم في الخلفية عشوائياً
        const starsContainer = document.getElementById('starsContainer');
        const numberOfStars = 120;

        for (let i = 0; i < numberOfStars; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }

        // نص الرسالة الفصحى
        const message = `في هذا اليوم المميّز، الحادي عشر من نوفمبر، أقف معترِفاً بأنّكِ أجملُ هديةٍ أهداها القدرُ لقَلبي. 

حين أنظرُ إليكِ، أرى الحياةَ بكلِّ ما فيها من ضياءٍ سكينة؛ فوُجودكِ بجانبي هو المعنى الحقيقيُّ للاطمئنان. لم تكوني يوماً صدفةً في عابري أيّامي، بل كنتِ القدرَ الجميلَ الذي استقرَّ في أعماقي ليُزهرَ عمري كله.

عاهدتُ قلبي أن أبقى لكِ السندَ والأمان، وأن أُحيطكِ دائماً بعشقٍ لا ينضب ولا يتغيّر.`;

        // تأثير الكتابة التلقائية (Typing Effect)
        let i = 0;
        const speed = 40; // سرعة ظهور الحروف بالمللي ثانية
        const textElement = document.getElementById('typingText');

        function typeWriter() {
            if (i < message.length) {
                textElement.innerHTML += message.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }

        // تشغيل تأثير الكتابة بعد تحميل الصفحة بـ ثانية
        window.onload = () => {
            setTimeout(typeWriter, 1000);
        };

        // وظيفة ظهور قلوب عند الضغط على الزر
        function createHearts() {
            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 80 + 10 + '%';
                heart.style.bottom = '40px';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 3000);
            }
        }
    </script>
</body>
</html>
